<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Offline — Habitat</title>
  <meta name="theme-color" content="#0a1310">
  <style>
    body { margin:0; padding:0; background:#0a1310; color:#c4d1c8; font-family:system-ui,sans-serif; display:flex; align-items:center; justify-content:center; height:100vh; }
    .card { text-align:center; max-width:420px; padding:32px; }
    h1 { font-size:1.5rem; margin:0 0 8px; }
    p { margin:8px 0; line-height:1.6; }
    a { color:#2ecc71; text-decoration:none; }
    a:hover { text-decoration:underline; }
  </style>
</head>
<body>
  <div class="card">
    <h1>You're offline</h1>
    <p>Habitat isn't loaded on this device yet. Connect to the internet, then reload to use the app.</p>
    <p>If you've used Habitat before, it will work from your home screen even when offline.</p>
  </div>
</body>
</html>
